<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Where's Biscuit?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <div id="game">
      <canvas id="screen" width="240" height="176"></canvas>

      <div id="hud" class="hidden">
        <div id="objective"><span class="label">GOAL</span><span id="objective-text"></span></div>
        <div id="clock"></div>
      </div>

      <div id="dialog" class="hidden">
        <div id="speaker" class="hidden"></div>
        <div id="text"></div>
        <div id="next"></div>
      </div>
      <div id="choices" class="hidden"></div>
      <div id="toast" class="hidden"></div>

      <div id="title" class="screen">
        <div class="title-card">
          <div class="title-small">a short story</div>
          <h1>Where's<br>Biscuit?</h1>
          <div class="blink" id="start-hint">PRESS ENTER</div>
          <div class="controls-hint">Arrows/WASD move &middot; Z/Space talk &middot; hold X run &middot; M mute</div>
        </div>
      </div>

      <div id="end" class="screen hidden">
        <div class="title-card">
          <h1>The End?</h1>
          <p>Biscuit is home.<br>Probably.</p>
          <button id="restart">Play again</button>
        </div>
      </div>
    </div>

    <div id="touch">
      <div id="dpad">
        <button data-dir="up" class="up" aria-label="Up"></button>
        <button data-dir="left" class="left" aria-label="Left"></button>
        <button data-dir="right" class="right" aria-label="Right"></button>
        <button data-dir="down" class="down" aria-label="Down"></button>
      </div>
      <div id="ab">
        <button data-btn="b" class="b">B</button>
        <button data-btn="a" class="a">A</button>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/story.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
